# Stop obexd offering the PBAP (Phone Book Access) server.
#
# The Bose headphones connect as a PBAP *client* and pull this laptop's
# phonebook on every connect. obexd answers by waking evolution-data-server
# (evolution-source-registry + evolution-addressbook-factory) — for a set of
# contacts a pair of headphones has no use for. It also keeps the BlueZ device
# busy during connect: see docs/bluetooth-reliability-vs-phone.md.
#
# ExecStart has to be cleared first — systemd appends to it otherwise, and a
# Type=dbus unit refuses to start with two ExecStart lines.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd --noplugin=pbap
