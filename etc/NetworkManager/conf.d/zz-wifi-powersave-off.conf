# Disable wifi power save.
#
# Ubuntu's network-manager package ships
# /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf with
# `wifi.powersave = 3` (3 = enable). Rather than edit that conffile (dpkg would
# prompt on upgrade), this drop-in overrides it: NetworkManager reads conf.d in
# alphanumerical order and later values win, so the `zz-` prefix must sort after
# `default-` — a numeric prefix like `90-` would sort BEFORE it and lose.
#
# 2 = disable. Reason: this is an Intel CNVi part, so wifi and Bluetooth share
# one RF front-end and antenna pair; power-save duty cycling adds coexistence
# jitter to the Bluetooth link. Machine is on AC most of the time and the battery
# cost is negligible next to the dev workload.
[connection]
wifi.powersave = 2
